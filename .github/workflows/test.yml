name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  # workflow_dispatch lets version-check.yml explicitly kick this off for a
  # bot-pushed branch -- GITHUB_TOKEN-authored pushes/PRs don't trigger the
  # `push`/`pull_request` events above (a GitHub Actions restriction to
  # prevent workflow recursion), so without this a bot-opened version-bump PR
  # would show zero checks.

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -l {0}
    env:
      # CEP-16 sharded repodata is still buggy as of 2026 -- shard fetches can
      # 404 and conda-build's internal solver calls don't reliably pick up a
      # `conda config --set plugins.use_sharded_repodata false` change the way
      # a plain `conda install` does. This env var disables it directly.
      CONDA_PLUGINS_USE_SHARDED_REPODATA: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: condabrew
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Install build dependencies
        run: conda install -n condabrew -c conda-forge conda-build pyyaml -y

      - name: Run test suite
        run: bash tests/run.sh quick
