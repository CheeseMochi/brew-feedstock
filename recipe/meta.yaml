# Every bottle install rewrites /opt/homebrew → $CONDA_PREFIX/homebrew at install time
{% set version = "5.1.11" %}

package:
  name: brew
  version: "{{ version }}"

source:
  - url: https://github.com/Homebrew/brew/archive/refs/tags/{{ version }}.tar.gz
    sha256: a0db79149cd9a8704d472b1928b12e9e31cb5960e06db570531defd064033601
  # .github/scripts/bump_brew_version.py computes and updates this; see RELEASING.md.

requirements:
  build:
    - git
    - bash
    # Not declared here, conda-build's isolated sandbox falls back to
    # whatever `patch` is on the system PATH -- on macOS that's Apple's
    # ancient BSD patch (2.0-12u11), which silently skips hunks it can't
    # match cleanly instead of failing, so conda-brew-path-rewrite.patch
    # would quietly not apply and ship stock, unpatched Homebrew.
    - patch
  run:
    - git >=2.30.0

build:
  number: 5
  skip: true  # [not osx]

test:
  commands:
    - brew --version
    - brew --prefix
    - brew --repository
    - brew --cellar
    - brew doctor || true  # a conda-scoped install legitimately triggers some checks
    - brew install hello
    - hello
    # brew info's human-readable "Poured from bottle on ..." line was dropped
    # upstream; poured_from_bottle now only shows up in the JSON API.
    - brew info --json=v2 hello | grep -E '"poured_from_bottle"[[:space:]]*:[[:space:]]*true'

about:
  homepage: https://brew.sh/
  license: BSD-2-Clause
  # Resolved relative to $SRC_DIR (conda-build falls back there when the path
  # isn't found in the recipe dir); matches the brew-<version>/ layout that
  # GitHub's tag-archive tarball extracts to.
  license_file: brew-{{ version }}/LICENSE.txt
  summary: Homebrew installed inside a conda environment, scoped per-environment
  description: >-
    Homebrew inside a conda environment. A `brew` CLI whose artifacts live only within the active conda env, scoped per-environment, isolated from the system.

    Why?

    macOS has no native package manager other than the App Store. Homebrew filled that gap, but it has three drawbacks for development workflows:

    - **System-wide installs** — everything goes under `/opt/homebrew`, shared across users and environments.
    - **No virtual env support** — you can only have one version of each dependency, available everywhere.
    - **Hard to clean up** — uninstalling brew leaves remnants scattered across the filesystem.

    This package solves this by shipping a fully functional `brew` CLI inside a conda package. When you `conda activate` an environment, `brew` works normally but installs only into that environment's prefix. Deactivate and it disappears.
  doc_url: https://docs.brew.sh/
  dev_url: https://github.com/Homebrew/brew/
